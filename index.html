<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mojoskem Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex h-screen bg-gray-100">
        <!-- Sidebar -->
        <div class="w-64 bg-slate-800 text-white">
            <div class="p-4 font-bold text-lg border-b border-slate-500">MOJOSKEM ADMIN</div>
            <nav class="mt-4">
                <a href="index.html" class="block px-4 py-3 bg-slate-700 hover:bg-slate-700 transition-colors">Dashboard</a>
                <a href="paket.html" class="block px-4 py-3 hover:bg-slate-700 transition-colors">Paket Tour</a>
                <a href="booking.html" class="block px-4 py-3 hover:bg-slate-700 transition-colors">Bookings</a>
                <a href="users.html" class="block px-4 py-3 hover:bg-slate-700 transition-colors">Users</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1">
            <header class="bg-white shadow">
                <div class="px-6 py-4">
                    <h1 class="text-xl font-semibold text-gray-800">Dashboard Overview</h1>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-gray-500 text-sm font-medium">Total Paket</h3>
                    <p class="mt-2 text-3xl font-bold text-gray-900">100</p>
                </div>
                
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-gray-500 text-sm font-medium">Booking Berjalan</h3>
                    <p class="mt-2 text-3xl font-bold text-gray-900">100</p>
                </div>

                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-gray-500 text-sm font-medium">Total Pengguna</h3>
                    <p class="mt-2 text-3xl font-bold text-gray-900">1000</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Add active state to navigation items
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                // Remove active state from all links
                document.querySelectorAll('nav a').forEach(l => {
                    l.classList.remove('bg-slate-700');
                });
                // Add active state to clicked link
                e.target.classList.add('bg-slate-700');
            });
        });
    </script>
</body>
</html>
