<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pemesanan Bus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white shadow-md rounded-lg p-8">

        <!-- Form Header -->
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Detail Pemesanan Bus</h1>

        <!-- Form -->
        <form class="space-y-6">
            <!-- Durasi Sewa -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Durasi Sewa <span class="text-red-500">*</span></label>
                <div class="relative">
                    <select class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500" required>
                        <option value="Full Day">Full Day</option>
                        <option value="Half Day">Half Day</option>
                        <option value="Half Day">More Than One Day</option>
                    </select>
                </div>
            </div>

            <!-- Tipe Bus -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Tipe Bus <span class="text-red-500">*</span></label>
                <div class="relative">
                    <select class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500" required>
                        <option value="Bus Double Decker">Bus Double Decker</option>
                        <option value="Bus Jetbus 5">Bus Jetbus 5</option>
                        <option value="Bus Kecil">Bus Kecil</option>
                    </select>
                </div>
            </div>

            <!-- Tanggal Sewa -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Tanggal Sewa <span class="text-red-500">*</span></label>
                <input type="date" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500" required>
            </div>

            <!-- Tanggal Selesai Sewa -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Tanggal Selesai Sewa <span class="text-red-500">*</span></label>
                <input type="date" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500" required>
            </div>

            <!-- Waktu Penjemputan -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Waktu keberangkatan dari Garasi <span class="text-red-500">*</span></label>
                <input type="time" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500" required>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Email <span class="text-red-500">*</span></label>
                <input type="email" placeholder="Masukkan email Anda" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500" required>
            </div>

            <!-- Pesan Tambahan -->
            <div>
                <label class="block text-gray-700 font-medium mb-2">Pesan Tambahan</label>
                <textarea placeholder="Tambahkan pesan (opsional)" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
            </div>

            <!-- Buttons -->
            <div class="flex justify-between items-center">
                <a href="form-bus.html"><button type="button" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition duration-200">
                    Back
                </button>
                </a>
                <button type="submit" class="bg-teal-600 text-white px-4 py-2 rounded-md hover:bg-teal-700 transition duration-200">
                    Pesan Sekarang
                </button>
            </div>
        </form>
    </div>
</body>
</html>
